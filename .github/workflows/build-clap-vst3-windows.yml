name: Build Windows x64 CLAP/VST3 Plugin

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build CLAP/VST3 for Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-clap-vst3-cache"

      - name: Build and Bundle CLAP/VST3 Plugin
        run: cargo run --package xtask --target x86_64-pc-windows-msvc -- bundle fm1_plugin --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm1-emu-windows-x64-clap-vst3
          path: |
            target/x86_64-pc-windows-msvc/release/*.clap
            target/x86_64-pc-windows-msvc/release/*.vst3
          if-no-files-found: error
