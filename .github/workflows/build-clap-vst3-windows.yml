name: Build Windows x64 CLAP Plugin

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build CLAP for Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-clap-cache"

      - name: Build fm1-plugin
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path crates/fm1-plugin/Cargo.toml

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm1-emu-windows-x64-clap
          path: target/x86_64-pc-windows-msvc/release/*.dll
          if-no-files-found: error
